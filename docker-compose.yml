services:
  db:
    image: postgres:16-alpine
    container_name: bookshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: bookshelf-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${POSTGRES_CONTAINER_HOST:-db}:${POSTGRES_CONTAINER_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=${POSTGRES_SCHEMA:-public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      GUEST_SESSION_TTL_DAYS: ${GUEST_SESSION_TTL_DAYS:-7}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_BASE_URL: ${GOOGLE_BOOKS_BASE_URL:-https://www.googleapis.com/books/v1}
      GOOGLE_BOOKS_REQUEST_TIMEOUT_MS: ${GOOGLE_BOOKS_REQUEST_TIMEOUT_MS:-8000}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      OPEN_LIBRARY_BASE_URL: ${OPEN_LIBRARY_BASE_URL:-https://openlibrary.org}
      OPEN_LIBRARY_USER_AGENT: "${OPEN_LIBRARY_USER_AGENT:-Bookshelf/0.1.0 (production; contact: configure@example.com)}"
      OPEN_LIBRARY_SEARCH_CACHE_TTL_HOURS: ${OPEN_LIBRARY_SEARCH_CACHE_TTL_HOURS:-24}
      OPEN_LIBRARY_DETAIL_CACHE_TTL_HOURS: ${OPEN_LIBRARY_DETAIL_CACHE_TTL_HOURS:-168}
      OPEN_LIBRARY_REQUEST_TIMEOUT_MS: ${OPEN_LIBRARY_REQUEST_TIMEOUT_MS:-8000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
      target: production
    container_name: bookshelf-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
