<main class="auth-page">
  <form class="auth-panel" (submit)="submitSignUp($event)">
    <a class="brand" routerLink="/">
      <i class="ph-bold ph-books" aria-hidden="true"></i>
      <span>Bookshelf</span>
    </a>
    <header>
      <h1>Create account</h1>
      <p>Save shelves permanently and keep guest-mode chaos contained.</p>
    </header>

    <app-form-control label="Display name" autocomplete="name" [control]="signUpForm.displayName" />
    <app-form-control label="Email" type="email" autocomplete="email" [control]="signUpForm.email" />
    <app-form-control label="Password" type="password" autocomplete="new-password" [control]="signUpForm.password" />

    @if (error()) {
      <p class="error-message" role="alert">{{ error() }}</p>
    }

    <button class="primary-button" type="submit" [disabled]="signUpForm().submitting()">
      {{ signUpForm().submitting() ? 'Creating...' : 'Create account' }}
    </button>

    <p class="auth-link">
      Already have an account? <a routerLink="/auth/sign-in">Sign in</a>
    </p>
  </form>
</main>
