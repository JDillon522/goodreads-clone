<main class="auth-page">
  <form class="auth-panel" (submit)="submitConfirm($event)">
    <a class="brand" routerLink="/">
      <i class="ph-bold ph-books" aria-hidden="true"></i>
      <span>Bookshelf</span>
    </a>
    <header>
      <h1>Confirm reset</h1>
      <p>Paste the reset token and choose a new password.</p>
    </header>

    <app-form-control
      label="Reset token"
      autocomplete="one-time-code"
      [control]="confirmForm.token"
    />
    <app-form-control
      label="New password"
      type="password"
      autocomplete="new-password"
      [control]="confirmForm.newPassword"
    />

    @if (error()) {
      <p class="error-message" role="alert">{{ error() }}</p>
    }

    <button class="primary-button" type="submit" [disabled]="confirmForm().submitting()">
      {{ confirmForm().submitting() ? 'Updating...' : 'Update password' }}
    </button>

    <p class="auth-link"><a routerLink="/auth/sign-in">Back to sign in</a></p>
  </form>
</main>
