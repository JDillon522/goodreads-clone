<main class="auth-page">
  <form class="auth-panel" (submit)="submitReset($event)">
    <a class="brand" routerLink="/">
      <i class="ph-bold ph-books" aria-hidden="true"></i>
      <span>Bookshelf</span>
    </a>
    <header>
      <h1>Reset password</h1>
      <p>Request a reset token. Development mode may return it for Swagger-style testing.</p>
    </header>

    <app-form-control label="Email" type="email" autocomplete="email" [control]="resetForm.email" />

    @if (message()) {
      <p class="success-message">{{ message() }}</p>
    }
    @if (resetToken()) {
      <p class="token-message">Token: <code>{{ resetToken() }}</code></p>
      <a class="secondary-button" routerLink="/auth/password-reset/confirm">Use token</a>
    }
    @if (error()) {
      <p class="error-message" role="alert">{{ error() }}</p>
    }

    <button class="primary-button" type="submit" [disabled]="resetForm().submitting()">
      {{ resetForm().submitting() ? 'Requesting...' : 'Request reset' }}
    </button>

    <p class="auth-link"><a routerLink="/auth/sign-in">Back to sign in</a></p>
  </form>
</main>
