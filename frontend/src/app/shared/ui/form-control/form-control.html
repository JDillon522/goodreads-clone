<label
  class="form-control"
  [class.form-control--compact]="size() === 'compact'"
  [class.form-control--invalid]="showError()"
>
  <span class="form-control__label">{{ label() }}</span>

  <span class="form-control__field">
    @if (icon()) {
      <i class="form-control__leading-icon ph {{ icon() }}" aria-hidden="true"></i>
    }

    @if (kind() === 'select') {
      <select
        class="form-control__native"
        [formField]="textControl()"
        [attr.aria-describedby]="describedBy()"
      >
        <ng-content />
      </select>
      <i class="form-control__trailing-icon ph ph-caret-down" aria-hidden="true"></i>
    } @else if (kind() === 'textarea') {
      <textarea
        class="form-control__native"
        [rows]="rows()"
        [formField]="textControl()"
        [attr.aria-describedby]="describedBy()"
      ></textarea>
    } @else {
      <input
        class="form-control__native"
        [type]="type()"
        [attr.autocomplete]="autocomplete() || null"
        [formField]="inputControl()"
        [attr.aria-describedby]="describedBy()"
      />
    }
  </span>

  @if (messageText()) {
    <span
      class="form-control__message"
      [class.form-control__message--error]="showError()"
      [id]="messageId"
    >
      {{ messageText() }}
    </span>
  }
</label>
