services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in .env}:5432"

  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@${POSTGRES_CONTAINER_HOST:-db}:${POSTGRES_CONTAINER_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=${POSTGRES_SCHEMA:-public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      GUEST_SESSION_TTL_DAYS: ${GUEST_SESSION_TTL_DAYS:-7}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_BASE_URL: ${GOOGLE_BOOKS_BASE_URL:-https://www.googleapis.com/books/v1}
      GOOGLE_BOOKS_REQUEST_TIMEOUT_MS: ${GOOGLE_BOOKS_REQUEST_TIMEOUT_MS:-8000}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/app/certs/local-ca.pem}
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run prisma:generate -w backend && npm run db:migrate:deploy -w backend && npm run start:dev -w backend"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: bookshelf-frontend
    restart: unless-stopped
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-workspace-node-modules:/app/frontend/node_modules
    expose:
      - "4200"
    command: npm run start -w bookshelf-frontend -- --host 0.0.0.0 --port 4200 --poll 2000

  proxy:
    build:
      target: development
    depends_on:
      - backend
      - frontend

volumes:
  backend-node-modules:
  frontend-node-modules:
  frontend-workspace-node-modules:
