services:

  db:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build:
      target: development
    env_file:
      - backend/.env.docker
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGIN: http://localhost:4200
      DATABASE_URL: postgresql://bookshelf:bookshelf@db:5432/bookshelf?schema=public
      JWT_ACCESS_SECRET: dev-only-access-secret-replace-before-deploy
      JWT_REFRESH_SECRET: dev-only-refresh-secret-replace-before-deploy
      GUEST_SESSION_TTL_DAYS: 7
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 30
      OPEN_LIBRARY_BASE_URL: https://openlibrary.org
      OPEN_LIBRARY_USER_AGENT: "Bookshelf/0.1.0 (local development; contact: local@example.com)"
      OPEN_LIBRARY_SEARCH_CACHE_TTL_HOURS: 24
      OPEN_LIBRARY_DETAIL_CACHE_TTL_HOURS: 168
      OPEN_LIBRARY_REQUEST_TIMEOUT_MS: 8000
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/app/certs/local-ca.pem}
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run prisma:generate -w backend && npm run db:migrate:deploy -w backend && npm run start:dev -w backend"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: bookshelf-frontend
    restart: unless-stopped
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
      - frontend-workspace-node-modules:/app/frontend/node_modules
    expose:
      - "4200"
    command: npm run start -w bookshelf-frontend -- --host 0.0.0.0 --port 4200 --poll 2000

  proxy:
    build:
      target: development
    depends_on:
      - backend
      - frontend

volumes:
  backend-node-modules:
  frontend-node-modules:
  frontend-workspace-node-modules:
